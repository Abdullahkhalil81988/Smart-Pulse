version: "3.9"

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - APP_ENV=development
    volumes:
      - ./uploads:/app/uploads
      - ./ml_core/models:/app/ml_core/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  express:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - FASTAPI_URL=http://fastapi:8000
    depends_on:
      fastapi:
        condition: service_healthy
